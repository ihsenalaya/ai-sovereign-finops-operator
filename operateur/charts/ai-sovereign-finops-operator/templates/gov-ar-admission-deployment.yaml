{{- if .Values.govArAdmission.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator.fullname" . }}-gov-ar-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gov-ar-admission
spec:
  replicas: {{ .Values.govArAdmission.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gov-ar-admission
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gov-ar-admission
    spec:
      serviceAccountName: {{ include "operator.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gov-ar-admission
          image: {{ include "operator.govArAdmissionImage" . | quote }}
          imagePullPolicy: {{ .Values.govArAdmission.image.pullPolicy }}
          command: ["/gov-ar-admission"]
          env:
            - name: GOV_AR_ADMISSION_ADDR
              value: ":8084"
            {{- if and .Values.govArAdmission.postgres.enabled .Values.govArAdmission.postgres.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.govArAdmission.postgres.existingSecret }}
                  key: {{ .Values.govArAdmission.postgres.secretKey }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.govArAdmission.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
