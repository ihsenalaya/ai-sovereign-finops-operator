                    - model_name
                    - model_resource_version
                    - model_uid
                    - namespace
                    - path_mode
                    - pricing_compliance_hash
                    - pricing_version
                    - provider_deployment
                    - provider_generation
                    - provider_name
                    - provider_resource_version
                    - provider_uid
                    - route_binding_name
                    - snapshot_hash
