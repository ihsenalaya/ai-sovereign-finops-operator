                        minimum: 1
                        type: integer
                      model_name:
                        minLength: 1
                        type: string
                      model_resource_version:
                        minLength: 1
                        type: string
                      model_uid:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                      path_mode:
