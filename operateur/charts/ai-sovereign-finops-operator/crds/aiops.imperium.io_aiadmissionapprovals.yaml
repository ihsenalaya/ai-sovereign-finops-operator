                    type: integer
                  expiresAt:
                    format: date-time
                    type: string
                  inputTokens:
                    format: int64
                    type: integer
                  inputTokensExact:
                    type: boolean
                  maxOutputTokens:
                    format: int64
                    type: integer
                  namespace:
                    type: string
                  requestDigest:
                    description: |-
                      RequestDigest is SHA-256 over all other request, policy, candidate,
                      route, reservation-input, and expiry fields in canonical struct order.
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  requestID:
                    type: string
                  routeSnapshot:
