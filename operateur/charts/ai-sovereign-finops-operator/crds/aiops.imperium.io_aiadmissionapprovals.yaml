                    - name
                    - uid
                    type: object
                  sensitiveData:
                    type: boolean
                  team:
                    type: string
                  tenantID:
                    type: string
                  workloadUID:
                    type: string
                required:
                - budgetPolicy
                - candidateModelRef
                - candidateSnapshotVersion
                - expiresAt
                - inputTokens
                - inputTokensExact
                - maxOutputTokens
                - namespace
                - requestDigest
                - requestID
                - routeSnapshot
                - routingPolicy
                - sensitiveData
                - tenantID
                - workloadUID
