---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: aiadmissionapprovals.aiops.imperium.io
spec:
  group: aiops.imperium.io
  names:
    kind: AIAdmissionApproval
    listKind: AIAdmissionApprovalList
    plural: aiadmissionapprovals
    shortNames:
    - aiaa
    singular: aiadmissionapproval
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.request.tenantID
      name: Tenant
      type: string
    - jsonPath: .spec.request.requestID
      name: Request
      type: string
    - jsonPath: .status.phase
