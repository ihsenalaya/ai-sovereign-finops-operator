{{- if .Values.govArAdmission.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "operator.fullname" . }}-gov-ar-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gov-ar-admission
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gov-ar-admission
  ports:
    - name: http
      port: 8084
      targetPort: http
      protocol: TCP
    {{- if not .Values.govArAdmission.devInMemory }}
    - name: ext-proc
      port: {{ .Values.govArAdmission.extProc.port }}
      targetPort: ext-proc
      protocol: TCP
    {{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
# The govar_* families (admission decisions, ledger transitions, durable worker
# state) are exposed by the admission service on its API port, not by the
# manager metrics service. Without this ServiceMonitor the GOV-AR dashboard has
# no data: the manager ServiceMonitor scrapes a port named "metrics", which the
# admission service does not expose.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "operator.fullname" . }}-gov-ar-admission
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gov-ar-admission
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gov-ar-admission
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
