{{- if and .Values.govArAdmission.enabled .Values.govArAdmission.enforcement.networkPolicy.enabled }}
{{- $gatewayNamespace := .Values.govArAdmission.enforcement.networkPolicy.gatewayNamespaceSelector }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "operator.fullname" . }}-governed-workload-egress
  namespace: {{ required "governedNamespace is required for GOV-AR egress enforcement" .Values.govArAdmission.enforcement.networkPolicy.governedNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  # This policy intentionally selects every Pod in the dedicated measured
  # namespace, so a workload owner cannot remove a label to regain egress.
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              {{- if $gatewayNamespace }}
              {{- toYaml $gatewayNamespace | nindent 14 }}
              {{- else }}
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.govArAdmission.enforcement.networkPolicy.gatewayPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.govArAdmission.enforcement.networkPolicy.gatewayPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "operator.fullname" . }}-gov-ar-admission-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gov-ar-admission
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- if $gatewayNamespace }}
              {{- toYaml $gatewayNamespace | nindent 14 }}
              {{- else }}
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
              {{- end }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.govArAdmission.enforcement.networkPolicy.gatewayPodSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.govArAdmission.extProc.port }}
{{- end }}
