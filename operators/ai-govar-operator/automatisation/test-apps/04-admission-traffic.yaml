# Generates real governed admission traffic so the GOV-AR dashboard shows
# decisions, ledger transitions and decision latency instead of empty panels.
#
# The request is authenticated with the Pod's projected ServiceAccount token
# (TokenReview): GOV-AR resolves the AIWorkloadBinding from the authenticated
# namespace + serviceAccountName, then requires every field of the body to match
# that operator-owned binding. A request cannot select its own binding, so the
# values below are copied from 02-binding.yaml and must stay in sync with it.
apiVersion: batch/v1
kind: Job
metadata:
  name: govar-admission-traffic
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: govar-admission-traffic
    spec:
      restartPolicy: Never
      serviceAccountName: payments-api
      volumes:
        # The default ServiceAccount token carries the API server audience.
        # GOV-AR rejects it and requires a token minted for its own audience,
        # so a caller cannot replay a token issued for something else.
        - name: govar-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: gov-ar-admission
                  expirationSeconds: 3600
      containers:
        - name: traffic
          image: curlimages/curl:8.10.1
          volumeMounts:
            - name: govar-token
              mountPath: /var/run/secrets/govar
              readOnly: true
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - sh
            - -c
            - |
              set -u
              BASE="http://govar-ai-govar-operator-gov-ar-admission.govar-system.svc.cluster.local:8084"
              TOKEN="$(cat /var/run/secrets/govar/token)"
              ok=0; err=0; denied=0
              i=1
              while [ "$i" -le 30 ]; do
                # Every 5th request asks for more output tokens than the
                # provider cap attested in the catalog (8192). Those must be
                # refused: a demo where nothing is ever denied does not show
                # that governance enforces anything.
                if [ $((i % 5)) -eq 0 ]; then
                  MAX_OUT=99000
                else
                  MAX_OUT=$((200 + i * 10))
                fi
                BODY=$(cat <<JSON
              {
                "request_id": "demo-$(date +%s)-$i",
                "namespace": "${POD_NAMESPACE}",
                "tenant_id": "tenant-payments",
                "workload_uid": "${POD_UID}",
                "team": "payments",
                "application": "payments-api",
                "sensitive_data": true,
                "allowed_zones": ["eu", "francecentral"],
                "budget_policy_name": "demo-budget",
                "routing_policy_name": "demo-routing",
                "input_tokens": $((500 + i * 25)),
                "input_tokens_exact": true,
                "max_output_tokens": ${MAX_OUT},
                "timeout_seconds": 30,
                "cancellation_possible": true
              }
              JSON
              )
                RESP=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "${BASE}/v1/admit" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data "${BODY}")
                # A governed refusal is a normal HTTP 200 carrying a decision,
                # not an HTTP error: only transport/auth failures are non-200.
                if [ "${RESP}" = "200" ]; then
                  if grep -q '"decision":"ADMIT"' /tmp/body; then
                    ok=$((ok + 1))
                  else
                    denied=$((denied + 1))
                    if [ "${denied}" -le 2 ]; then
                      echo "request $i governed refusal:"; cat /tmp/body; echo ""
                    fi
                  fi
                else
                  err=$((err + 1))
                  if [ "${err}" -le 2 ]; then
                    echo "request $i -> HTTP ${RESP}"
                    cat /tmp/body; echo ""
                  fi
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "admission: ${ok} ADMIT, ${denied} governed refusals, ${err} transport errors"
              # A governed REJECT is a valid decision: the point is to exercise the
              # decision path and populate govar_admission_decisions_total.
              if [ "$((ok + denied))" -eq 0 ]; then exit 1; fi
              echo "ADMISSION TRAFFIC GENERATED"
