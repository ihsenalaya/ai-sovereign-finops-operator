# Local OpenAI-compatible endpoint for the quality evaluation Job.
#
# WHY THIS EXISTS: a quality score is a promotion decision, so the operator
# refuses to derive one from hand-written evidence — the evidence ConfigMap must
# carry provenance labels that only the real evaluation Job writes. Forging
# those labels would defeat the control. Instead this stub lets the REAL
# pipeline run end to end: the operator creates its Job, the Job performs real
# HTTP calls, parses real responses, scores them and writes properly-labelled
# evidence.
#
# WHAT IS AND IS NOT REAL: the evaluation, scoring and provenance are the
# operator's own code paths. Only the model behind the endpoint is a stub
# returning canned answers, because kind has no provider API keys. The scores
# are therefore genuine measurements of a fake model — useful to exercise and
# demonstrate the gate, never a basis for a production promotion decision.
apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-gateway-script
data:
  server.py: |
    """Minimal OpenAI-compatible stub for the quality evaluation Job."""
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # Canned answers per model, for the HR golden prompts. The candidate
    # (mistral-small) answers slightly less completely than the source
    # (mistral-large), so the gate has a real quality difference to measure
    # instead of a tie.
    ANSWERS = {
        "mistral-large-latest": {
            "leave": "Pour un congé, consultez votre solde disponible, envoyez la "
                     "demande à votre manager et attendez sa validation.",
            "expense": "Déposez les justificatifs de la note de frais, choisissez "
                       "le centre de coût, puis soumettez-la pour approbation.",
        },
        "mistral-small-latest": {
            "leave": "Demandez votre congé à votre manager après avoir vérifié "
                     "votre solde.",
            "expense": "Joignez les justificatifs de frais et soumettez la note "
                       "pour approbation.",
        },
    }

    def pick(model, prompt):
        table = ANSWERS.get(model) or ANSWERS["mistral-large-latest"]
        low = prompt.lower()
        if "congé" in low or "conge" in low or "politique" in low:
            return table["leave"]
        if "frais" in low or "note" in low:
            return table["expense"]
        return table["leave"]

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            try:
                payload = json.loads(self.rfile.read(length) or b"{}")
            except json.JSONDecodeError:
                payload = {}
            model = self.headers.get("x-ai-eg-model") or payload.get("model", "gpt-4o")
            prompt = ""
            for message in payload.get("messages", []):
                if message.get("role") == "user":
                    prompt = message.get("content", "")
            content = pick(model, prompt)
            body = json.dumps({
                "id": "chatcmpl-stub",
                "object": "chat.completion",
                "model": model,
                "choices": [{
                    "index": 0,
                    "message": {"role": "assistant", "content": content},
                    "finish_reason": "stop",
                }],
                "usage": {
                    "prompt_tokens": max(1, len(prompt.split())),
                    "completion_tokens": max(1, len(content.split())),
                    "total_tokens": max(2, len(prompt.split()) + len(content.split())),
                },
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            print("eval-gateway " + fmt % args, flush=True)

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-gateway
  labels:
    app: eval-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-gateway
  template:
    metadata:
      labels:
        app: eval-gateway
    spec:
      containers:
        - name: server
          image: python:3.12-alpine
          command: ["python3", "/srv/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /srv
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
      volumes:
        - name: script
          configMap:
            name: eval-gateway-script
---
apiVersion: v1
kind: Service
metadata:
  name: eval-gateway
spec:
  selector:
    app: eval-gateway
  ports:
    - port: 80
      targetPort: 8080
