name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache-dependency-path: |
            operateur/go.sum
          cache: true

      - name: Verify generated manifests are up to date
        working-directory: operateur
        run: |
          make manifests generate
          git diff --exit-code || (echo "Run 'make manifests generate' and commit the result" && exit 1)

      - name: Vet
        working-directory: operateur
        run: go vet ./...

      - name: Unit + envtest
        working-directory: operateur
        run: make test

      - name: Build all binaries
        working-directory: operateur
        run: make build

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint confidential governance chart
        run: helm lint charts/ai-confidential-governance-platform

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: controller
            file: operateur/Dockerfile
            context: operateur
          - name: attestation-scheduler
            file: operateur/Dockerfile.scheduler
            context: operateur
          - name: key-release-gateway
            file: operateur/Dockerfile.key-release-gateway
            context: operateur
          - name: platform-api
            file: operateur/Dockerfile.platform-api
            context: operateur
          - name: thesis-bench
            file: operateur/Dockerfile.thesis-bench
            context: operateur
          - name: platform-ui
            file: platform-ui/Dockerfile
            context: platform-ui
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -t ${{ matrix.name }}:ci -f ${{ matrix.file }} ${{ matrix.context }}
