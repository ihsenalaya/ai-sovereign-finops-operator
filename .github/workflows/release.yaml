name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/ai-sovereign-finops-operator
  GRAFANA_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-sovereign-finops-grafana-radar
  GRAFANA_RADAR_TAG: 11.2.2-echarts6.6.0
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/ai-sovereign-finops-operator/charts

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # governance-operator
      - name: Build and push governance-operator
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/controller:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/controller:latest

      # attestation-scheduler
      - name: Build and push attestation-scheduler
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile.scheduler
          push: true
          tags: |
            ${{ env.REGISTRY }}/attestation-scheduler:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/attestation-scheduler:latest

      # key-release-gateway
      - name: Build and push key-release-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile.key-release-gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/key-release-gateway:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/key-release-gateway:latest

      # platform-api
      - name: Build and push platform-api
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile.platform-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/platform-api:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/platform-api:latest

      # thesis-bench
      - name: Build and push thesis-bench
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile.thesis-bench
          push: true
          tags: |
            ${{ env.REGISTRY }}/thesis-bench:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/thesis-bench:latest

      # gov-ar-admission
      - name: Build and push gov-ar-admission
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile.gov-ar-admission
          push: true
          tags: |
            ${{ env.REGISTRY }}/gov-ar-admission:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/gov-ar-admission:latest

      # gov-ar-calibration-producer
      - name: Build and push gov-ar-calibration-producer
        uses: docker/build-push-action@v6
        with:
          context: ./operateur
          file: ./operateur/Dockerfile.gov-ar-calibration-producer
          push: true
          tags: |
            ${{ env.REGISTRY }}/gov-ar-calibration-producer:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/gov-ar-calibration-producer:latest

      # platform-ui
      - name: Build and push platform-ui
        uses: docker/build-push-action@v6
        with:
          context: ./platform-ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/platform-ui:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/platform-ui:latest

      # Grafana with pre-installed radar plugin
      - name: Build and push Grafana radar image
        uses: docker/build-push-action@v6
        with:
          context: ./automatisation/demo
          file: ./automatisation/demo/Dockerfile.grafana
          push: true
          tags: |
            ${{ env.GRAFANA_IMAGE }}:${{ env.GRAFANA_RADAR_TAG }}
            ${{ env.GRAFANA_IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.GRAFANA_IMAGE }}:latest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Derive version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check chart version matches tag
        run: |
          chart_version="$(sed -nE 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' charts/ai-confidential-governance-platform/Chart.yaml)"
          app_version="$(sed -nE 's/^appVersion:[[:space:]]*"?([^"]+)"?/\1/p' charts/ai-confidential-governance-platform/Chart.yaml)"
          expected="${{ steps.v.outputs.version }}"
          echo "Chart version: ${chart_version}, App version: ${app_version}, Tag: ${expected}"
          test "${chart_version}" = "${expected}"
          test "${app_version}" = "${expected}"

      - name: Lint chart
        run: helm lint charts/ai-confidential-governance-platform

      - name: Package chart
        run: helm package charts/ai-confidential-governance-platform --destination dist

      - name: Push chart to OCI registry
        run: helm push "dist/ai-confidential-governance-platform-${{ steps.v.outputs.version }}.tgz" "oci://${{ env.CHART_REGISTRY }}"
