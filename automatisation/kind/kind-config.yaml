# Lean single-node kind cluster for the AI Sovereign FinOps Operator demo.
# Kept minimal to fit RAM-constrained machines (e.g. WSL2 ~7 GiB).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: greenops
nodes:
  - role: control-plane
    extraPortMappings:
      # ArgoCD UI
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # In-cluster Gitea (Git server) HTTP — used to seed the repo from the host
      - containerPort: 30083
        hostPort: 30083
        protocol: TCP
      # Platform UI (NodePort 30090 → container 8080)
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      # Platform API (NodePort 30091 → container 8083)
      - containerPort: 30091
        hostPort: 30091
        protocol: TCP
      # Key-Release Gateway (NodePort 30092 → container 8082)
      - containerPort: 30092
        hostPort: 30092
        protocol: TCP
